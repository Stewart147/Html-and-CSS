        .pagination{
            text-align: center;
        }

        .pagination a{
            color: black;
            background-color: black;
            border-radius: 30px;
            text-decoration: none;  /* removes underlining */
            padding: 8px 15px;
            display: inline-block;  /* allows us to adjust width and height of elements */
        }

        .pagination a.active{
            background-color: hsl(120, 100%, 70%); 
            font-weight: bold;
            border-radius: 30px;
        }

        .pagination a:hover:not(.active){
            background-color: hsl(0, 0%, 77%);
            border-radius: 30px;
        }

      


    </style>
    
</head>
