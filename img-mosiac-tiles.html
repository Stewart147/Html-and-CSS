<!DOCTYPE html>

    <head>
        <title>Challenge 5A Grid</title>
        <style>

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                margin: 20px;
            }

            .container-grid{
                display: grid;                                          /* displays grid  */
                grid-template-columns: auto auto auto auto auto;        /* auto autosizes the 3 columns i.e responsive */
                grid-gap: 10px;                                         /* creates space between sections */
                grid-template-rows: 180px 60px 60px 140px 140px;               
                                                                          

            }

            .section1{
                grid-column: 1 / 2;
                grid-row: 1 / 4;
                background-color: blue;
                color: white;
                text-align: center;
                font-size: 20px;
            }

           .section2{
                grid-column: 2 / 3;
                grid-row: 1 / 4;
                background-color: yellow;
                color: white;
                text-align: center;
                font-size: 20px;
            }

            .section3{
                grid-column: 3 / 4;
                grid-row: 1 / 5;
                background-color: cyan;
                color: white;
                text-align: center;
                font-size: 20px;
            }

            .section4{
                grid-column: 4 / 6;
                grid-row: 1 / 2;
                background-color: green;
                color: white;
                text-align: center;
                font-size: 20px;
            }

            .section5{
                grid-column: 1 / 2;
                grid-row: 4 / 6;
                background-color: purple;
                color: white;
                text-align: center;
                font-size: 20px;
            }

             .section6{
                grid-column: 2 / 3;
                grid-row: 4 / 5;
                background-color: red;
                color: white;
                text-align: center;
                font-size: 20px;

                color: white;
                text-align: center;
                font-size: 20px;
            }

             .section8{
                grid-column: 5 / 6;
                grid-row: 2 / 6;
                background-color: brown;
                color: white;
                text-align: center;
                font-size: 20px;
            }

             .section9{
                grid-column: 2 / 3;
                grid-row: 5 / 6;
                background-color: orange;
                color: white;
                text-align: center;
                font-size: 20px;
            }

              .section10{
                grid-column: 3 / 5;
                grid-row: 5 / 6;
