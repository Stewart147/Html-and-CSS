<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Challenge 4</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/8a10e0f309.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <header>
        <div class="logo-section">
            <h1>LOGO</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT US</a></li>
                <li><a href="purchase.html">PURCHASE</a></li>
                <li><a href="featured.html">FEATURED</a></li>
                <li><a href="contact.html">CONTACT US</a></li>
            </ul>
        </nav>

        <div class="social-section">
            <i class="fa-solid fa-magnifying-glass fa-lg" style="color: #ffffff;"></i>
            <input class="search-input" type="search" placeholder="Search...">
            <i class="fa-solid fa-question fa-lg" style="color: #ffffff;"></i>
            <i class="fa-solid fa-cart-shopping fa-lg" style="color: #ffffff;"></i>
        </div>
    </header>

    <div class="main-container">
        <div class="lhs"></div>
        
        <div class="content-area">
            <div class="contact-box">
                <h1>CONTACT US</h1>
                
                <form>
                    <div class="form-content">
                        <div class="form-left">
                            <div class="form-group">
                                <label>PLEASE SELECT A TOPIC RELATED TO YOUR INQUIRY*</label>
                                <select id="services" name="services">
                                    <option value="">Select a topic...</option>
                                    <option value="newcar">New Car</option>
                                    <option value="usedcar">Used Car</option>
                                    <option value="repairs">Repairs</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>MESSAGE*</label>
                                <textarea name="message" placeholder="Enter your message here..."></textarea>
                            </div>
                        </div>

                        <div class="form-right">
                            <div class="form-group">
                                <label>FIRST NAME*</label>
                                <input type="text" name="firstname" placeholder="Enter your first name">
                            </div>
                            
                            <div class="form-group">
                                <label>LAST NAME*</label>
                                <input type="text" name="lastname" placeholder="Enter your last name">
                            </div>
                            
                            <div class="form-group">
                                <label>E-MAIL*</label>
                                <input type="email" name="email" placeholder="Enter your email address">
                            </div>
                            
                            <button type="submit" class="submit-btn">SEND</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="rhs"></div>
    </div>

    <div class="footer-section">
        <div class="footer-left"></div>
        <div class="footer-center">
            <div class="car-placeholder">
                 <img class="car-img" src="images/car1.png">

            </div>
            <div class="car-placeholder">
                 <img class="car-img" src="images/car2.png">
            </div>
            <div class="car-placeholder">
                 <img class="car-img" src="images/car3.png">
            </div>
            <div class="car-placeholder">
                 <img class="car-img" src="images/car4.png">
            </div>
        </div>
        <div class="footer-right"></div>
    </div>
</body>
</html>
